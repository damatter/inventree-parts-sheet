[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-parts-sheet"
version = "0.3.0"
description = "Spreadsheet-style catalogue, safe part numbering, and Customer Pricing for InvenTree"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Matt Dick"}]
dependencies = ["xlrd>=2.0.2,<3", "openpyxl>=3.1.5,<4", "boto3>=1.34,<2"]

[project.urls]
Homepage = "https://github.com/damatter/inventree-parts-sheet"
Issues = "https://github.com/damatter/inventree-parts-sheet/issues"

[project.entry-points.inventree_plugins]
PartsSheet = "parts_sheet.plugin:PartsSheetPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parts_sheet = ["templates/**/*.html", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/host", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
