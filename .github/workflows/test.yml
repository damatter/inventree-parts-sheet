name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -e . 'Django>=5.2,<5.3' djangorestframework django-money pytest ruff build
          git clone https://github.com/damatter/inventree-customer-pricing.git ../customer-pricing
          git -C ../customer-pricing checkout 4fb8551178668cffc54e7dda8cfde39cf880083a
          pytest -q
          ruff check src tests
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: dist/*
  inventree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: InvenTree 1.3.5 installation and workflow
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e INVENTREE_PLUGINS_ENABLED=true \
            -e INVENTREE_DB_ENGINE=sqlite3 \
            -e INVENTREE_DB_NAME=/tmp/parts-sheet.sqlite3 \
            -e INVENTREE_SITE_URL=http://localhost \
            -e INVENTREE_DEBUG=false \
            -v "$PWD:/plugin-src:ro" inventree/inventree:1.3.5 \
            -lc 'set -e; mkdir -p /home/inventree/data; cp -R /plugin-src /tmp/plugin-build; pip install /tmp/plugin-build git+https://github.com/damatter/inventree-customer-pricing.git@4fb8551178668cffc54e7dda8cfde39cf880083a; cd /home/inventree/src/backend/InvenTree; python manage.py migrate --noinput; python manage.py shell < /plugin-src/tests/inventree_enable.py; python manage.py migrate --noinput; python manage.py shell < /plugin-src/tests/inventree_smoke.py'
